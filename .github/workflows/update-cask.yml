name: Update Cask

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version tag (leave blank for latest)'
        required: false
        default: ''

jobs:
  update-cask:
    name: Update Cask Definition
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Fetch Release and Update Cask
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          TAG="${INPUT_VERSION}"
          if [ -z "${TAG}" ]; then
            TAG=$(gh release view --repo easonwong-de/Aggregate-Volume-Menu --json tagName -q .tagName)
          fi

          VERSION="${TAG#v}"
          echo "Target version: ${VERSION}"

          gh release download "${TAG}" \
            --repo easonwong-de/Aggregate-Volume-Menu \
            --pattern "AggregateVolumeMenu.zip*"

          if [ -f "AggregateVolumeMenu.zip.sha256" ]; then
            SHA256=$(awk '{print $1}' AggregateVolumeMenu.zip.sha256)
          else
            SHA256=$(sha256sum AggregateVolumeMenu.zip | awk '{print $1}')
          fi

          echo "SHA256: ${SHA256}"

          sed -i -E "s/version \".*\"/version \"${VERSION}\"/" Casks/aggregate-volume-menu.rb
          sed -i -E "s/sha256 .*/sha256 \"${SHA256}\"/" Casks/aggregate-volume-menu.rb

          rm -f AggregateVolumeMenu.zip*

          if git diff --quiet; then
            echo "Cask is already up to date with version ${VERSION}."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -am "chore(cask): update aggregate-volume-menu to ${VERSION}"
          git push
